<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AEGIS NN — Operator Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <h1>Operator Profile</h1>
      <span class="crumb">/ account</span>
      <div class="topbar-right">
        <a href="settings.html" class="pill" id="btn-settings"></a>
        <button class="btn btn-primary" id="btn-signout">Sign out</button>
        <span class="avatar" id="topbar-avatar">JM</span>
      </div>
    </header>

    <div class="content">
      <div class="page">
        <div class="page-grid">
          <div style="display:flex;flex-direction:column;gap:14px">
            <section class="panel profile-card">
              <div class="profile-avatar" id="pf-initials">JM</div>
              <div class="profile-name" id="pf-name">Jude Mekat</div>
              <div class="profile-role" id="pf-role">Security Operations Lead</div>
              <div class="profile-badges">
                <span class="pill" style="height:24px;font-size:10.5px">Admin</span>
                <span class="pill live" style="height:24px;font-size:10.5px">On shift</span>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head"><span class="panel-title">Session</span></div>
              <div class="kv-list">
                <div class="kv"><span class="k">Organisation</span><span class="v" id="pf-org">—</span></div>
                <div class="kv"><span class="k">Role</span><span class="v">Full access</span></div>
                <div class="kv"><span class="k">Last sign-in</span><span class="v mono" id="pf-lastlogin">—</span></div>
                <div class="kv"><span class="k">Data source</span><span class="v" id="pf-source">—</span></div>
                <div class="kv"><span class="k">Model uptime</span><span class="v mono" id="pf-uptime">—</span></div>
              </div>
            </section>
          </div>

          <div style="display:flex;flex-direction:column;gap:14px">
            <div class="stat-strip" style="grid-template-columns:repeat(4,1fr);margin-bottom:0" id="pf-stats"></div>

            <section class="panel">
              <div class="panel-head">
                <span class="panel-title">Your review activity · last 14 days</span>
                <div class="right"><span class="pill" style="height:24px;font-size:10.5px">alerts handled</span></div>
              </div>
              <div class="mini-body" style="height:210px"><canvas id="activityChart"></canvas></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <span class="panel-title">Assigned network scope</span>
                <div class="right"><span class="pill" style="height:24px;font-size:10.5px" id="pf-scope-count">—</span></div>
              </div>
              <div class="kv-list" id="pf-scope"></div>
            </section>

            <section class="panel">
              <div class="panel-head"><span class="panel-title">Recent actions</span></div>
              <div class="table-scroll" style="max-height:260px">
                <table>
                  <thead>
                    <tr><th>Time</th><th>Action</th><th>Target</th><th>Class</th><th style="text-align:right">Result</th></tr>
                  </thead>
                  <tbody id="pf-actions"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
