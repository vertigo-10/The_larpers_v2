<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Devices — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css?v=20260836" />
<link rel="stylesheet" href="assets/css/intro.css?v=20260836" />
</head>
<!-- The household version of nodes.html. Same data underneath; the difference
     is that this page leads with what a device has been doing rather than with
     its throughput, and offers the one action a home user can actually take. -->
<body data-org-scope="consumer">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <h1>My Devices</h1>
      <span class="crumb" id="crumb">/ things on your network</span>
      <div class="topbar-right">
        <span class="pill" id="stream-pill"><span class="dot" id="stream-dot"></span> <span id="stream-text">Connecting</span></span>
        <button class="pill" id="btn-refresh"></button>
        <a href="profile.html" class="avatar" id="topbar-avatar">··</a>
      </div>
    </header>

    <div class="content">
      <div class="page">
        <div class="notice">
          <span id="ico-notice"></span>
          <span>
            Everything your traffic passes through, starting with your router.
            A device appears here on its own the first time it sends anything.
            Figures cover the last five minutes.
          </span>
        </div>

        <div class="home-stats" id="device-stats"></div>

        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">Your devices</span>
            <div class="right"><a class="pill" href="home-alerts.html">See all alerts</a></div>
          </div>
          <div class="plain-list" id="devices"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/intro.js?v=20260836"></script>
<script src="assets/js/config.js?v=20260836"></script>
<script src="assets/js/api.js?v=20260836"></script>
<script src="assets/js/ui.js?v=20260836"></script>
<script src="assets/js/home-devices.js?v=20260836"></script>
</body>
</html>
