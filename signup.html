<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create organisation — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css?v=20260826" />
</head>
<body class="auth">
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <div class="brand-name">SENTRY<span>NN</span></div>
      <div class="brand-sub">Threat Detection</div>
    </div>
  </div>

  <div class="auth-title">Create your organisation</div>
  <div class="auth-sub">
    You'll be the first admin. Everything you monitor stays scoped to this
    organisation — no other tenant can see it.
  </div>

  <!-- method="post" for the same reason as login.html: a native submit must
       never be able to put the chosen password into a query string. -->
  <form class="auth-form" id="signup-form" method="post" action="signup.html" novalidate>
    <div class="form-error" id="err"></div>

    <div class="field">
      <label>What are you protecting?</label>
      <div class="org-type-picker" id="org-type-picker">
        <button type="button" class="org-type-opt selected" data-org-type="company">
          <span class="t">A company or team network</span>
          <span class="d">Multiple sites/nodes, a team with roles, an audit trail.</span>
        </button>
        <button type="button" class="org-type-opt" data-org-type="consumer">
          <span class="t">My home network</span>
          <span class="d">Your router and devices — simple, single-network setup.</span>
        </button>
      </div>
      <input type="hidden" id="org_type" name="org_type" value="company" />
    </div>

    <div class="field">
      <label for="org_name" id="org_name-label">Organisation name</label>
      <input type="text" id="org_name" name="org_name" required
             maxlength="120" placeholder="Acme Networks" />
    </div>

    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" autocomplete="name" required
             maxlength="120" placeholder="Jane Mercer" />
    </div>

    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="username"
             required placeholder="you@company.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" required placeholder="••••••••••••" />
      <span class="hint" id="pw-hint">At least 12 characters. Length beats symbols.</span>
    </div>

    <button type="submit" class="auth-btn" id="submit">Create organisation</button>
  </form>

  <div class="auth-alt">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script src="assets/js/config.js?v=20260826"></script>
<script src="assets/js/api.js?v=20260826"></script>
<script src="assets/js/ui.js?v=20260826"></script>
<script src="assets/js/auth.js?v=20260826"></script>
</body>
</html>
