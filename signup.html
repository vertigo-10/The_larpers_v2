<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create organisation — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="auth">
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <div class="brand-name">SENTRY<span>NN</span></div>
      <div class="brand-sub">Threat Detection</div>
    </div>
  </div>

  <div class="auth-title">Create your organisation</div>
  <div class="auth-sub">
    You'll be the first admin. Everything you monitor stays scoped to this
    organisation — no other tenant can see it.
  </div>

  <form class="auth-form" id="signup-form" novalidate>
    <div class="form-error" id="err"></div>

    <div class="field">
      <label for="org_name">Organisation name</label>
      <input type="text" id="org_name" name="org_name" required
             maxlength="120" placeholder="Acme Networks" />
    </div>

    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" autocomplete="name" required
             maxlength="120" placeholder="Jane Mercer" />
    </div>

    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="username"
             required placeholder="you@company.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" required placeholder="••••••••••••" />
      <span class="hint" id="pw-hint">At least 12 characters. Length beats symbols.</span>
    </div>

    <button type="submit" class="auth-btn" id="submit">Create organisation</button>
  </form>

  <div class="auth-alt">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
