<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css?v=20260835" />
<link rel="stylesheet" href="assets/css/intro.css?v=20260835" />
</head>
<body class="auth">
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <div class="brand-name">SENTRY<span>NN</span></div>
      <div class="brand-sub">Threat Detection</div>
    </div>
  </div>

  <div class="auth-title">Sign in</div>
  <div class="auth-sub">Access your organisation's live network monitoring.</div>

  <!--
    method="post" is load-bearing, not decoration. auth.js calls
    preventDefault() and posts via fetch, so this form should never submit
    natively — but "should never" is not "cannot". If a script fails to load,
    throws before it attaches the listener, or the user hits Enter during that
    window, the browser submits the form itself. With the default method=get
    that puts the plaintext password in the URL, and from there into browser
    history, the server access log, and any Referer header. POST keeps
    credentials in a body that nothing routinely records.
  -->
  <form class="auth-form" id="login-form" method="post" action="login.html" novalidate>
    <div class="form-error" id="err"></div>

    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="username"
             required placeholder="you@company.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required placeholder="••••••••••••" />
    </div>

    <button type="submit" class="auth-btn" id="submit">Sign in</button>
  </form>

  <div class="auth-alt" id="alt">
    No organisation yet? <a href="signup.html">Create one</a>
  </div>
</div>

<script src="assets/js/intro.js?v=20260835"></script>
<script src="assets/js/config.js?v=20260835"></script>
<script src="assets/js/api.js?v=20260835"></script>
<script src="assets/js/ui.js?v=20260835"></script>
<script src="assets/js/auth.js?v=20260835"></script>
</body>
</html>
