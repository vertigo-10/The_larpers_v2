<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="auth">
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <div class="brand-name">SENTRY<span>NN</span></div>
      <div class="brand-sub">Threat Detection</div>
    </div>
  </div>

  <div class="auth-title">Sign in</div>
  <div class="auth-sub">Access your organisation's live network monitoring.</div>

  <form class="auth-form" id="login-form" novalidate>
    <div class="form-error" id="err"></div>

    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="username"
             required placeholder="you@company.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required placeholder="••••••••••••" />
    </div>

    <button type="submit" class="auth-btn" id="submit">Sign in</button>
  </form>

  <div class="auth-alt" id="alt">
    No organisation yet? <a href="signup.html">Create one</a>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
