<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alerts — SENTRY NN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css?v=20260827" />
</head>
<!-- The household version of alerts.html. The enterprise page is a work queue
     with a severity filter and an assignment model; this one answers "does any
     of this need me", and defaults to showing only the things that do. -->
<body data-org-scope="consumer">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <h1>Alerts</h1>
      <span class="crumb" id="crumb">/ what we've spotted</span>
      <div class="topbar-right">
        <span class="pill" id="stream-pill"><span class="dot" id="stream-dot"></span> <span id="stream-text">Connecting</span></span>
        <button class="pill" id="btn-refresh"></button>
        <a href="profile.html" class="avatar" id="topbar-avatar">··</a>
      </div>
    </header>

    <div class="content">
      <div class="page">
        <!-- Same verdict component as the home page, deliberately. Someone who
             clicks through from there should not be met by a different mood. -->
        <section class="home-hero" id="hero">
          <div class="ring" id="hero-ring"></div>
          <div>
            <div class="verdict-line" id="hero-line">Checking…</div>
            <div class="verdict-why" id="hero-why">One moment.</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <span class="panel-title" id="list-title">Needs your attention</span>
            <div class="right">
              <button class="pill" id="btn-scope">Show everything</button>
            </div>
          </div>
          <div class="plain-list" id="alerts"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=20260827"></script>
<script src="assets/js/api.js?v=20260827"></script>
<script src="assets/js/ui.js?v=20260827"></script>
<script src="assets/js/home-alerts.js?v=20260827"></script>
</body>
</html>
